title: ssbt's blog # name of the site
author: ssbt # name of site's author
email: kakehgarabedian@gmail.com # email of site's author
url: https://kwssbt.github.io # root address of the site
baseurl: "" # 用户站(仓库 kwssbt/kwssbt.github.io)部署在根路径;若日后改成项目页,CI 会用 Pages 的 base_path 覆盖
description: > # description of the site (multiple lines allowed)
  Life is coding, and I am debugging it.

lang: zh-CN # 供 jekyll-seo-tag 生成 og:locale,并作为 html lang 兜底

permalink: /:slug.html

favicon: "logo.png" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics

# 主题文件已随仓库提供(_layouts/_includes/_sass),不再使用 remote_theme

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page
  lowercase_titles: false # show titles in lowercase in lists

# 以下文件不参与构建,不会被复制进 _site(注意:设置了 exclude 就会覆盖 Jekyll 的默认列表)
exclude:
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - .jektex-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE.txt
  - "*.gemspec"

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jektex

jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ["\\Q", "\\mathbb{Q}"]
    - ["\\C", "\\mathbb{C}"]
